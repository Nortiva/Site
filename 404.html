<!doctype html>
<html lang="pt-BR">

<head>
  <!-- Feito por Matheus - NORTIVA STUDIO -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página não encontrada — Nortiva</title>
  <meta name="description" content="A página que você procura não existe ou foi movida.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F4F6FA">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">

  <style>
    :root {
      --blue: #244bff;
      --blue-hover: #1a3be0;
      --ink: #14161d;
      --ink-2: #434959;
      --bg: #f4f6fa;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img { display: block; max-width: 100%; height: auto; }
    h1, p { margin: 0; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
    ::selection { background: var(--blue); color: #fff; }

    .page {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo { width: 160px; margin-bottom: 48px; }

    .code {
      font-size: clamp(88px, 22vw, 168px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.06em;
      color: var(--blue);
    }

    h1 {
      margin-top: 16px;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -.03em;
      text-wrap: balance;
    }

    .text {
      margin-top: 16px;
      color: var(--ink-2);
      text-wrap: pretty;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      margin-top: 36px;
      padding: 0 28px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: background-color .2s;
    }

    .btn:hover { background: var(--blue-hover); }

    .alt { margin-top: 24px; font-size: 15px; color: var(--ink-2); }
    .alt a { color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }
    .alt a:hover { color: var(--blue); }

    @media (max-width: 560px) {
      .logo { width: 132px; margin-bottom: 40px; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>

  <main class="page">
    <a href="/" aria-label="Nortiva, ir para o início">
      <img class="logo" src="/assets/logo-grafite-recortada.png" width="1499" height="382" alt="Nortiva">
    </a>

    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p class="text">O endereço que você acessou não existe ou foi movido. Confira se o link está certo ou volte para o início.</p>

    <a class="btn" href="/">Voltar ao início</a>

  </main>

</body>

</html>
